[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidewindow"
version = "0.1.0"
description = "Find sailable windows at Emsworth: enough water + the right wind."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # stdlib only, on purpose

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tidewindow = "tidewindow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
